<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="label">Brand & accent</div>
  <div class="row" style="margin-bottom:12px">
    <div class="swatch" style="background:#177851; color:#fff; border-color:#177851">
      <div class="name">Primary</div><div class="hex">#177851</div>
    </div>
    <div class="swatch" style="background:#62A930; color:#0F3A29; border-color:#62A930">
      <div class="name">Accent Lime</div><div class="hex">#62A930</div>
    </div>
    <div class="swatch" style="background:#6FC433; color:#0F3A29; border-color:#6FC433">
      <div class="name">Lime Glow</div><div class="hex">#6FC433</div>
    </div>
    <div class="swatch" style="background:radial-gradient(120% 180% at 0% 100%, #95D56B 0%, #62A930 35%, #1A5A50 75%, #0F3A29 100%); color:#fff; border-color:transparent">
      <div class="name">Gradient</div><div class="hex">radial · lime→dark</div>
    </div>
  </div>
</div>
</body></html>
