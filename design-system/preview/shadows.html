<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="background:#F6F5F1">
  <div class="label">Shadow system · green-tinted</div>
  <div style="display:flex; gap:20px; padding:14px 4px 14px; align-items:center">
    <div style="text-align:center"><div style="width:90px; height:70px; background:#fff; border-radius:10px; box-shadow:0 1px 2px hsla(168,40%,15%,.04)"></div><div class="mono" style="margin-top:10px">xs</div></div>
    <div style="text-align:center"><div style="width:90px; height:70px; background:#fff; border-radius:10px; box-shadow:0 2px 4px hsla(168,40%,15%,.05),0 1px 2px hsla(168,40%,15%,.04)"></div><div class="mono" style="margin-top:10px">sm · card</div></div>
    <div style="text-align:center"><div style="width:90px; height:70px; background:#fff; border-radius:10px; box-shadow:0 4px 12px hsla(168,40%,15%,.06),0 2px 4px hsla(168,40%,15%,.04)"></div><div class="mono" style="margin-top:10px">md · hover</div></div>
    <div style="text-align:center"><div style="width:90px; height:70px; background:#fff; border-radius:10px; box-shadow:0 12px 32px hsla(168,40%,15%,.08),0 4px 8px hsla(168,40%,15%,.05)"></div><div class="mono" style="margin-top:10px">lg · modal</div></div>
    <div style="text-align:center"><div style="width:90px; height:70px; background:#fff; border-radius:10px; box-shadow:0 0 0 4px hsla(93,55%,42%,.25)"></div><div class="mono" style="margin-top:10px">focus</div></div>
  </div>
</div>
</body></html>
