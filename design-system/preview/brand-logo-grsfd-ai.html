<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="background:#F6F5F1; display:flex; gap:14px; align-items:center; justify-content:space-between; padding:0; overflow:hidden">
  <div style="background:#ffffff; padding:18px; flex:1; display:flex; align-items:center; justify-content:center; min-height:120px; position:relative">
    <img src="../assets/logos/grsfd-ai.png" style="height:56px; width:auto; display:block"/>
    <span style="position:absolute; left:10px; bottom:8px; font-family:var(--font-mono); font-size:10px; color:hsl(155,14%,45%); text-transform:uppercase; letter-spacing:.08em">on white</span>
  </div>
  <div style="background:#0F3A29; padding:18px; flex:1; display:flex; align-items:center; justify-content:center; min-height:120px; position:relative">
    <img src="../assets/logos/grsfd-ai-ondark.png" style="height:56px; width:auto; display:block"/>
    <span style="position:absolute; left:10px; bottom:8px; font-family:var(--font-mono); font-size:10px; color:hsl(155,20%,70%); text-transform:uppercase; letter-spacing:.08em">on dark</span>
  </div>
</div>
</body></html>
