<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="label">Core palette</div>
  <div class="row" style="margin-bottom:12px">
    <div class="swatch" style="background:#F6F5F1; color:#1A5A50">
      <div class="name">Background</div><div class="hex">#F6F5F1</div>
    </div>
    <div class="swatch" style="background:#1A5A50; color:#F6F5F1; border-color:#1A5A50">
      <div class="name">Foreground</div><div class="hex">#1A5A50</div>
    </div>
    <div class="swatch" style="background:#0F3A29; color:#F6F5F1; border-color:#0F3A29">
      <div class="name">Dark Green</div><div class="hex">#0F3A29</div>
    </div>
    <div class="swatch" style="background:#FFFFFF; color:#1A5A50">
      <div class="name">Card</div><div class="hex">#FFFFFF</div>
    </div>
  </div>
</div>
</body></html>
