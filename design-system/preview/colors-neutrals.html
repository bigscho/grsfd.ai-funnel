<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="label">Neutrals & borders</div>
  <div class="row">
    <div class="swatch" style="background:#DCE8E3; color:#1A5A50">
      <div class="name">Secondary</div><div class="hex">#DCE8E3</div>
    </div>
    <div class="swatch" style="background:#D7E0DC; color:#1A5A50">
      <div class="name">Muted</div><div class="hex">#D7E0DC</div>
    </div>
    <div class="swatch" style="background:#FFFFFF; color:#527A6B; border-color:#CED9D4">
      <div class="name">Border</div><div class="hex">#CED9D4</div>
    </div>
    <div class="swatch" style="background:#FFFFFF; color:#527A6B">
      <div class="name">Muted FG</div><div class="hex">#527A6B</div>
    </div>
  </div>
</div>
</body></html>
