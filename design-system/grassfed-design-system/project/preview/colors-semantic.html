<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="label">Semantic</div>
  <div class="row">
    <div class="swatch" style="background:#EB1F1F; color:#fff; border-color:#EB1F1F">
      <div class="name">Destructive</div><div class="hex">#EB1F1F</div>
    </div>
    <div class="swatch" style="background:#F5A623; color:#4a2e00; border-color:#F5A623">
      <div class="name">Warning</div><div class="hex">#F5A623</div>
    </div>
    <div class="swatch" style="background:#229E5B; color:#fff; border-color:#229E5B">
      <div class="name">Success</div><div class="hex">#229E5B</div>
    </div>
    <div class="swatch" style="background:#177851; color:#fff; border-color:#177851; box-shadow:0 0 0 4px rgba(98,169,48,0.35)">
      <div class="name">Focus ring</div><div class="hex">lime @ 25%</div>
    </div>
  </div>
</div>
</body></html>
