<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="background:#F6F5F1">
  <div class="label">Metric cards</div>
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px">
    <div style="background:#fff; border:1px solid #CED9D4; border-radius:14px; padding:16px; box-shadow:0 2px 4px hsla(168,40%,15%,.05)">
      <div style="font-family:var(--font-body); font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:#527A6B">Homeowners</div>
      <div style="font-family:var(--font-display); font-size:32px; font-weight:600; letter-spacing:-0.02em; color:#1A5A50; margin-top:4px">4,050</div>
      <div style="font-family:var(--font-body); font-size:12px; color:#62A930; font-weight:600">↑ 12× postcard</div>
    </div>
    <div style="background:#fff; border:1px solid #CED9D4; border-radius:14px; padding:16px; box-shadow:0 2px 4px hsla(168,40%,15%,.05)">
      <div style="font-family:var(--font-body); font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:#527A6B">Open rate</div>
      <div style="font-family:var(--font-display); font-size:32px; font-weight:600; letter-spacing:-0.02em; color:#1A5A50; margin-top:4px">38%</div>
      <div style="font-family:var(--font-body); font-size:12px; color:#527A6B">past 7 days</div>
    </div>
    <div style="background:#0F3A29; border:1px solid #0F3A29; border-radius:14px; padding:16px; color:#F6F5F1">
      <div style="font-family:var(--font-body); font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:#62A930">Replies</div>
      <div style="font-family:var(--font-display); font-size:32px; font-weight:600; letter-spacing:-0.02em; margin-top:4px">127</div>
      <div style="font-family:var(--font-body); font-size:12px; color:#DCE8E3">9 booked calls</div>
    </div>
  </div>
</div>
</body></html>
