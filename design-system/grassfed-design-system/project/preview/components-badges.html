<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="label">Badges & pills</div>
  <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
    <span style="display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:9999px; background:#DCE8E3; color:#177851; font-family:var(--font-body); font-size:12px; font-weight:600">● Active</span>
    <span style="display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:9999px; background:#62A930; color:#0F3A29; font-family:var(--font-body); font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase">Farm</span>
    <span style="padding:4px 10px; border-radius:9999px; background:#0F3A29; color:#F6F5F1; font-family:var(--font-body); font-size:12px; font-weight:600">Beta</span>
    <span style="padding:4px 10px; border-radius:9999px; background:#fff; color:#527A6B; font-family:var(--font-body); font-size:12px; font-weight:600; border:1px solid #CED9D4">Draft</span>
    <span style="padding:4px 10px; border-radius:9999px; background:rgba(235,31,31,.1); color:#EB1F1F; font-family:var(--font-body); font-size:12px; font-weight:600">Bounced</span>
    <span style="padding:4px 10px; border-radius:9999px; background:#F6F5F1; color:#1A5A50; font-family:var(--font-mono); font-size:11px; font-weight:600">4,050 emails</span>
  </div>
</div>
</body></html>
