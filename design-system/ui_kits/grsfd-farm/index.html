<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grsfd farm — workspace</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>body{margin:0;background:var(--bg)}*{box-sizing:border-box}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<body data-screen-label="grsfd Farm Workspace">
<div id="root"></div>
<script src="../_shared/icons.js"></script>
<script type="text/babel" src="Farm.jsx"></script>
<script type="text/babel">
function App() {
  return (
    <FarmShell active="territories">
      <FarmTopbar />
      <VolumeDashboard />
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 300px', gap: 14 }}>
        <TerritoryTable />
        <TeamRoster />
      </div>
    </FarmShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
